[package]
name = "mohar-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
mohar-core = { path = "../crates/mohar-core" }
serde_json = "1.0"

# Not part of the main workspace: stable builds and cargo-deny never see this crate.
[workspace]

[[bin]]
name = "receipt_json"
path = "fuzz_targets/receipt_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_json"
path = "fuzz_targets/checkpoint_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_file"
path = "fuzz_targets/log_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chain_mutation"
path = "fuzz_targets/chain_mutation.rs"
test = false
doc = false
bench = false
