name: Feature or change
description: Propose work. Every pull request starts from one of these.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, for whom, and how you know.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Link the part of docs/design.md it touches, if any.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that prove it works. Pull requests are reviewed against these.
      placeholder: |
        - a test shows ...
        - mohar verify reports ...
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Will an AI agent write the change?
      options: ["No", "Yes, and I will review and sign off every commit"]
    validations:
      required: true
