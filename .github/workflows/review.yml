name: Review

# A model reads every pull request's diff and leaves a review: likely bugs, security holes, missing
# tests, unclear docs. It uses Gemini's free tier through the GEMINI_API_KEY repository secret, so it
# costs nothing; the diff of this public repository is all it is sent. The check is required, so no pull request merges without a
# review, but it never fails on what the model says: a model can suggest, never decide (design
# section 5). Tests, clippy, fuzzing and the coverage floor decide.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Model review
    # Dependency bumps are checked by cargo-deny and the tests; a skipped job counts as passed.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A long diff is cut so the request stays small, and the review says so.
          git diff --stat "$BASE" "$HEAD" > stat.txt
          git diff --unified=3 "$BASE" "$HEAD" -- . ':(exclude)*.lock' ':(exclude)spec/vectors/*.json' ':(exclude)site/vendor/**' > full.diff
          head -c 200000 full.diff > diff.txt
          if [ "$(wc -c < full.diff)" -gt 200000 ]; then echo "cut=yes" >> "$GITHUB_OUTPUT"; fi
          {
            echo "Review this pull request to Mohar, a Rust trust layer for AI agents (signed hash-chained"
            echo "receipts, a loopback daemon, policy gates). Rules the project holds itself to: fail closed,"
            echo "no unwrap or panics on input, every security rule tested, every new receipt field in the"
            echo "spec, fast_canonical and check.py, plain human prose in docs."
            echo
            echo "List concrete problems only, most serious first: bugs, security holes, missed callers,"
            echo "untested branches, docs that now say something false. For each, name the file and line"
            echo "and say what goes wrong. If you find nothing worth raising, say so in one line. No praise,"
            echo "no summary of the change."
            echo
            echo "Files changed:"
            cat stat.txt
            echo
            echo "Diff:"
            cat diff.txt
          } > prompt.txt

      - name: Ask the model
        id: model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not set. Add a free key from Google AI Studio as a repository secret."
            exit 1
          fi
          jq -n --rawfile p prompt.txt '{
            systemInstruction: {parts: [{text: "You are a careful senior reviewer of Rust and security-sensitive code. You are terse and specific."}]},
            contents: [{role: "user", parts: [{text: $p}]}],
            generationConfig: {maxOutputTokens: 2048, temperature: 0.2}
          }' > request.json
          # Retried, since the free tier can answer 429 or 503 for a moment.
          curl -sS --fail-with-body --retry 3 --retry-all-errors --retry-delay 10 -m 120             -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json"             -d @request.json             "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" > answer.json
          jq -er '[.candidates[0].content.parts[]?.text] | join("")' answer.json > response.md
          echo "response-file=$PWD/response.md" >> "$GITHUB_OUTPUT"

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RESPONSE_FILE: ${{ steps.model.outputs.response-file }}
          CUT: ${{ steps.diff.outputs.cut }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          {
            echo "### Model review"
            echo
            if [ "$CUT" = "yes" ]; then echo "_The diff was longer than the model reads; only the first 200 kB was reviewed._"; echo; fi
            cat "$RESPONSE_FILE"
            echo
            echo "<sub>Suggestions only. Merging is decided by the tests and the other required checks.</sub>"
          } > review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          # A fork's token can't comment; the review is in the job summary either way.
          if [ "$SAME_REPO" = "true" ]; then
            gh pr comment "$PR" --repo "$REPO" --edit-last --body-file review.md 2>/dev/null \
              || gh pr comment "$PR" --repo "$REPO" --body-file review.md
          fi
