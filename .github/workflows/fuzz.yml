name: Fuzz

# Not a required check. Pull requests get a 60 second smoke run per target; a weekly schedule runs
# each for 15 minutes. Crash inputs are uploaded; a crash found becomes a regression test.

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 60 seconds on pull requests, 15 minutes on the schedule and manual runs.
  FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '900' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [receipt_json, checkpoint_json, log_file, chain_mutation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time="$FUZZ_SECONDS"
        env:
          TARGET: ${{ matrix.target }}
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
