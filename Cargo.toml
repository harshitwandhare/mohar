[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/harshitwandhare/mohar"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

# Signing and verifying thousands of receipts in a test is minutes in an unoptimised build of the
# crypto crates, seconds in an optimised one. Only dependencies are optimised; Mohar's own code
# keeps its debug assertions and symbols.
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
