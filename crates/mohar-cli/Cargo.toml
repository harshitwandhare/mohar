[package]
name = "mohar-cli"
version = "0.1.0"
description = "Command-line tool for Mohar receipt logs."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mohar"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mohar-core = { path = "../mohar-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
sha2 = "0.11"
