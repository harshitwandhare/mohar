[package]
name = "mohar-core"
version = "0.1.0"
description = "Signed, hash-chained receipts for AI agent decisions."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = "3.0"
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.12"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false
