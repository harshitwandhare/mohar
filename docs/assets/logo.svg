    <circle cx="224" cy="244" r="5"/><circle cx="240" cy="244" r="5"/><circle cx="256" cy="244" r="5"/>
    <circle cx="272" cy="244" r="5"/><circle cx="288" cy="244" r="5"/>
    <rect x="228" y="250" width="56" height="94"/>
    <rect x="212" y="344" width="88" height="10" rx="5"/>
